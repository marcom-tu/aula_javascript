<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="../css/atividade_css_grid_login.css">
    <meta http-equiv="refresh" content="1">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">

</head>

<body bgcolor="F0F2F2">
    <div class="externo">
        <div class="esquerdo">
            <div>
                <h1>Wellcome Back!</h1>
            </div>
            <div align=center>
                <small>To keep connected with us
                    <br>
                    please sign with your personal info</small>
            </div>
            <div>
                <button>SING IN</button>
            </div>
        </div>
        <div class="direito">
            <div class="h1D">
                <h1>Create Account</h1>
            </div>
            <div class="IMGS">
                <a href="#" class="img"><img src="imagens/graylogo/facebook.png" width="18px"></a>
                <a href="#" class="img"><img src="imagens/graylogo/google+.png" width="18px"></a>
                <a href="#" class="img"><img src="imagens/graylogo/linkedin.png" width="13px"></a>
            </div>
            <div>
                <small> or use tour email for registration</small>
            </div>
            <div class="inputs">
                <div >
                    <input class="inputuser" type="text" placeholder="Name">
                </div>
                <div>
                    <input class="inputmail" type="email" placeholder="Email">
                </div>
                <div>
                    <input class="inputpass" type="password" placeholder="Password">
                </div>
            </div>
            <div>
                <button type="submit">SIGN UP</button>
            </div>
        </div>
    </div>
</body>

</html>
