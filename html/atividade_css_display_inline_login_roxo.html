<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        button{
            background-color: #512da8;
            color: #fff;
            padding: 10px 45px;
            border: 1px solid white;
            border-radius: 8px;
            margin: 20px;
        }

        form {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            height: 100%;
            width: 100%;
        }

        input {
            background-color: #eee;
            border: none;
            margin: 8px 0;
            padding: 10px 15px;
            font-size: 13px;
            border-radius: 8px;
            width: 300px;
            outline: none;
        }

        small{
            font-size: small;
        }

        .container {
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            max-width: 100%;
            min-height: 480px;
        }

        .img {
            border: 1px solid #ccc;
            border-radius: 20%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            width: 40px;
            height: 40px;
        }

        .form-container {
            position: absolute;
            height: 100%;
            width: 50%;
        }



        .toggle-container {
            position: absolute;
            left: 50%;
            width: 50%;
            height: 100%;
            border-radius: 150px 0 0 100px;
            background-color: #512da8;
            color: #fff;
        }

        .toggle-panel {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
            padding: 0 80px;
            text-align: center;
        }
        
    </style>
</head>

<body link="#512da8">

    <div class="container">
        <div class="form-container">
            <form>
                <div>
                    <h1>Entrar</h1>
                </div>
                <div>
                    <table>
                        <tr>
                            <td>
                    <a href="#" class="img"><img src="imagens/google+.png" width="23px"></a>
                    </td>
                    <td>
                    <a href="#" class="img"><img src="imagens/facebook2.jpg" width="15px"></a>
                    </td>
                    <td>
                    <a href="#" class="img"><img src="imagens/github.png" width="15px"></a>
                    </td>
                    <td>
                    <a href="#" class="img"><img src="imagens/linkedin.png" width="15px"></a>
                    </td>
                    </tr>
                </table>
                </div>
                <div>
                    <small>ou use sua senha de email</small>
                </div>
                <div>
                    <input type="email" placeholder="Email">
                </div>
                <div>
                    <input type="password" placeholder="Password">
                </div>
                <div>
                    <a href="#"><small>Esqueceu sua senha?</small></a>
                </div>
                <div>
                    <button>Entrar</button>
                </div>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle-panel">
                <h1>Olá, amigo!</h1>
                <small>
                    <p>Registre-se com seus dados pessoais para usar todos os recursos do site</p>
                </small>
                <button>Inscrever</button>
            </div>
        </div>
    </div>

</body>

</html>
